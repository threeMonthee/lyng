spring:
  application:
    name: lyng
  config:
    # 凭据只从环境读取；本地放在仓库根的 .env（已 gitignore）
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${LYNG_DB_URL:jdbc:postgresql://localhost:5432/lyng}
    username: ${LYNG_DB_USER:lyng}
    password: ${LYNG_DB_PASSWORD:lyng}
  sql:
    init:
      mode: always
      continue-on-error: false
  mvc:
    async:
      request-timeout: -1

server:
  address: ${LYNG_HOST:127.0.0.1}
  port: ${LYNG_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true

lyng:
  seed: ${LYNG_SEED:true}
  client-dist: ${LYNG_CLIENT_DIST:../client/dist}
  model:
    backend: ${LYNG_MODEL_BACKEND:openrouter}
    api-key: ${OPENROUTER_API_KEY:}
    base-url: ${LYNG_OPENROUTER_URL:https://openrouter.ai/api/v1}
    provider: ${LYNG_PROVIDER:Parasail}
    default-model: ${LYNG_MODEL:deepseek/deepseek-v4.1-flash}
    character: ${LYNG_MODEL_CHARACTER:}
    narrator: ${LYNG_MODEL_NARRATOR:}
    narrator-round: ${LYNG_MODEL_NARRATOR_ROUND:@off}
    check: ${LYNG_MODEL_CHECK:@off}
    consolidate: ${LYNG_MODEL_CONSOLIDATE:}
    create: ${LYNG_MODEL_CREATE:}
    max-tokens: ${LYNG_MAX_TOKENS:8000}
    backoff-ms: 1500
    header-timeout-sec: 90
    idle-timeout-sec: 90
    budget-usd: ${LYNG_BUDGET_USD:}
    fake-delay-ms: ${LYNG_FAKE_DELAY_MS:30}
  embedding:
    backend: ${LYNG_EMBEDDING_BACKEND:dashscope}
    api-key: ${DASHSCOPE_API_KEY:}
    base-url: ${LYNG_EMBEDDING_URL:https://llm-28ifbzleob5xw5z5.cn-beijing.maas.aliyuncs.com}
    model: ${LYNG_EMBEDDING_MODEL:qwen3.7-text-embedding}
    dimension: ${LYNG_EMBEDDING_DIMENSION:1024}

logging:
  level:
    root: INFO
